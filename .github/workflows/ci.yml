name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Resolves the whole pub workspace (packages/* and app/).
      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Test budget_core
        working-directory: packages/budget_core
        run: dart test

      - name: Test budget_simplefin
        working-directory: packages/budget_simplefin
        run: dart test

      - name: Test budget_store
        working-directory: packages/budget_store
        run: dart test

      - name: Test app
        working-directory: app
        run: flutter test --coverage
