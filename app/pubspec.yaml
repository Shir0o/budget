name: budget
description: "Private, local-first, zero-based budget."
publish_to: 'none'
version: 1.0.0+1
resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  budget_core: any
  budget_mcp: any
  budget_migration: any
  budget_simplefin: any
  budget_store: any
  budget_sync: any
  flutter_secure_storage: ^11.2.0
  path_provider: ^2.1.6
  local_auth: ^3.0.2
  file_picker: ^13.3.0
  workmanager: ^0.10.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  archive: ^4.0.0
  sqlite3: ^3.8.0

flutter:
  uses-material-design: true

  # Fonts are bundled. Nothing is fetched at runtime.
  assets:
    - assets/fonts/OFL.txt
  fonts:
    - family: IBMPlexSans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSans-Bold.ttf
          weight: 700
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexMono-SemiBold.ttf
          weight: 600
