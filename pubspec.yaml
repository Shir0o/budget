name: budget_workspace
publish_to: none

environment:
  sdk: ^3.13.0

workspace:
  - packages/budget_core
  - packages/budget_simplefin
  - packages/budget_store
  - packages/budget_sync
  - app

hooks:
  user_defines:
    sqlite3:
      # Bundle SQLCipher instead of plain SQLite so the event store is encrypted.
      source: sqlcipher
